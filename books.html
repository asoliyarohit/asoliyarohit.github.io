<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelf — Rohit Singh Asoliya</title>
  <meta name="description" content="Books read and on the reading list of Rohit Singh Asoliya." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta property="og:title" content="Shelf — Rohit Singh Asoliya" />
  <meta property="og:description" content="Books read and on the reading list of Rohit Singh Asoliya." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ff5b2e' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261011" />
  <script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="books">
<main>
  <div class="room3d" id="room3d" data-state="idle">
    <canvas id="stage" aria-label="A reading room: pick a book on the shelf and two drones will fetch it"></canvas>
    <div class="bar bar-top"></div><div class="bar bar-bottom"></div>
    <div class="room-title container">
      <p class="mono">04 &mdash; Shelf</p>
      <h1>On the <em class="serif">shelf</em></h1>
    </div>
    <div class="titlecard" id="titlecard"></div>
    <button class="putback" id="putback" type="button">Put it back on the shelf</button>
    <p class="hint mono" id="hint">Pick a book &mdash; the helpers will fetch it</p>
    <div class="loader" id="loader"><span class="mono">Setting the scene&hellip;</span></div>
    <div class="fallback" id="fallback" hidden></div>
  </div>
</main>

<script type="module">
  const root = document.getElementById('room3d');
  const books = await fetch('content/books.json').then(r => r.json());
  try {
    const { start } = await import('./shelf3d/main.js?v=20261011');
    await start(root, books);
  } catch (err) {
    console.error(err);
    /* no WebGL: show the shelf as a plain, readable list instead */
    root.classList.add('flat');
    document.getElementById('loader').classList.add('gone');
    const fb = document.getElementById('fallback'); fb.hidden = false;
    fb.innerHTML = '<div class="container"><p class="mono">Your browser can\u2019t show the 3D reading room, so here is the shelf as a list.</p>' +
      books.map(b => `<article><h3>${b.title}</h3><p class="mono">${b.author}</p><p>${b.summary}</p>${b.link ? `<a class="link-arrow" href="${b.link}" target="_blank" rel="noopener">Find it on Amazon &nearr;</a>` : ''}</article>`).join('') + '</div>';
  }
</script>
<script src="script.js?v=20261011"></script>
</body>
</html>
